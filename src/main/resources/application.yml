server:
  port: ${PORT:3002}
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    context-path: /bank-api

management:
  # Expose basic actuator info and health; actuator is served under the same context-path
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${ALLOWED_ORIGINS:https://vscode-internal-15158-beta.beta01.cloud.kavia.ai:3000,https://vscode-internal-15158-beta.beta01.cloud.kavia.ai:3002,http://localhost:3000,http://localhost:4000}
        allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
        allowed-headers: Content-Type,Authorization,X-Requested-With,Origin,Accept
        exposed-headers: Location,Link
        allow-credentials: true
        max-age: 3600
  endpoint:
    health:
      show-details: "never"

spring:
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  datasource:
    # In-memory H2 datasource with console access; DB kept alive for the JVM lifetime
    url: jdbc:h2:mem:bankdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  web:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS:https://vscode-internal-15158-beta.beta01.cloud.kavia.ai:3000,https://vscode-internal-15158-beta.beta01.cloud.kavia.ai:3002,http://localhost:3000,http://localhost:4000}
      allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
      allowed-headers: Content-Type,Authorization,X-Requested-With,Origin,Accept
      exposed-headers: Location,Link
      allow-credentials: true
      max-age: 3600

# Enable data seeding by running with the 'seed' Spring profile:
#   -Dspring.profiles.active=seed
# Examples:
#   mvn -f Migration-Java-21-43251/pom.xml spring-boot:run -Dspring-boot.run.profiles=seed
#   java -jar target/bankapp-java21-0.0.1-SNAPSHOT.jar --spring.profiles.active=seed

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    # Keep Swagger UI under the app context-path:
    # Resulting URL: /bank-api/swagger-ui (redirects to /bank-api/swagger-ui/index.html)
    path: /swagger-ui
    enabled: true
