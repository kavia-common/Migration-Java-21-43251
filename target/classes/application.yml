server:
  port: ${PORT:3002}
  address: 0.0.0.0
  servlet:
    context-path: /bank-api

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: "never"

springdoc:
  swagger-ui:
    # Keep Swagger UI under the app context-path:
    # Resulting URL: /bank-api/swagger-ui (redirects to /bank-api/swagger-ui/index.html)
    path: /swagger-ui
